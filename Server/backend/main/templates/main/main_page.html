<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio Recorder</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        #recordBtn, #stopBtn { font-size: 1.2em; margin: 10px; }
        #status { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Record Audio</h1>
    <button id="recordBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop Recording</button>
    <div id="status"></div>
    <div id="transcript" style="margin-top:30px; border:1px solid #ccc; padding:10px; min-height:60px;">Transcript will appear here...</div>
    <button id="summarizeBtn" disabled>Summarize</button>
    <div id="summary" style="margin-top:30px; border:1px solid #4caf50; padding:10px; min-height:60px; background:#f9fff9;"></div>
    
    <form id="csrf-form" style="display:none;">{% csrf_token %}</form>
    
    <script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let batchTimer = null;
    let stopRequested = false;
    let fullTranscript = '';
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusDiv = document.getElementById('status');
    const transcriptDiv = document.getElementById('transcript');
    const summarizeBtn = document.getElementById('summarizeBtn');
    const summaryDiv = document.getElementById('summary');

    function getCSRFToken() {
        const csrfInput = document.querySelector('#csrf-form input[name=csrfmiddlewaretoken]');
        return csrfInput ? csrfInput.value : '';
    }

    function appendTranscript(text) {
        if (transcriptDiv.innerText === 'Transcript will appear here...') {
            transcriptDiv.innerText = '';
        }
        transcriptDiv.innerText += text + ' ';
        fullTranscript += text + ' ';
        if (fullTranscript.trim().length > 0) {
            summarizeBtn.disabled = false;
        }
    }

    async function sendAudioBatch(blob, isFinal=false) {
        const formData = new FormData();
        formData.append('audio', blob, 'batch.wav');
        formData.append('is_final', isFinal ? '1' : '0');
        try {
            const response = await fetch('transcriber/api/transcribe/batch/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCSRFToken(),
                },
                body: formData
            });
            const data = await response.json();
            if (data.transcript) {
                appendTranscript(data.transcript);
            }
            statusDiv.innerText = isFinal ? 'Recording stopped.' : 'Batch sent!';
        } catch (err) {
            statusDiv.innerText = 'Error sending audio batch.';
        }
    }

    function startBatchTimer() {
        batchTimer = setTimeout(() => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop(); // triggers dataavailable
            }
        }, 10000); // 10 seconds
    }

    function clearBatchTimer() {
        if (batchTimer) {
            clearTimeout(batchTimer);
            batchTimer = null;
        }
    }

    function startRecording() {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                isRecording = true;
                stopRequested = false;
                recordBtn.disabled = true;
                stopBtn.disabled = false;
                statusDiv.innerText = 'Recording...';
                transcriptDiv.innerText = 'Transcript will appear here...';
                summaryDiv.innerHTML = '';
                summarizeBtn.disabled = true;
                fullTranscript = '';
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = async (e) => {
                    audioChunks.push(e.data);
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    audioChunks = [];
                    await sendAudioBatch(audioBlob, stopRequested);
                    if (!stopRequested) {
                        // Start next batch
                        mediaRecorder.start();
                        startBatchTimer();
                    } else {
                        isRecording = false;
                        recordBtn.disabled = false;
                        stopBtn.disabled = true;
                        statusDiv.innerText = 'Recording stopped.';
                        stream.getTracks().forEach(track => track.stop());
                    }
                };

                mediaRecorder.onstart = () => {
                    audioChunks = [];
                    startBatchTimer();
                };

                mediaRecorder.onstop = () => {
                    clearBatchTimer();
                };

                // Start first batch
                mediaRecorder.start();
                startBatchTimer();
            })
            .catch(err => {
                statusDiv.innerText = 'Microphone access denied.';
            });
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            stopRequested = true;
            mediaRecorder.stop(); // triggers dataavailable, isFinal=true
        }
    }

    // Minimal markdown to HTML converter (bold, italics, headers, lists)
    function markdownToHtml(md) {
        let html = md
            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
            .replace(/^# (.*$)/gim, '<h1>$1</h1>')
            .replace(/\*\*(.*?)\*\*/gim, '<b>$1</b>')
            .replace(/\*(.*?)\*/gim, '<i>$1</i>')
            .replace(/\n\n/g, '<br/><br/>')
            .replace(/\n/g, '<br/>');
        // Simple lists
        html = html.replace(/^- (.*)$/gim, '<li>$1</li>');
        return html;
    }

    async function sendTranscriptForSummary() {
        summaryDiv.innerHTML = 'Summarizing...';
        try {
            const response = await fetch('summerizer/api/summarize/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ transcript: fullTranscript })
            });
            const data = await response.json();
            if (data.summary) {
                summaryDiv.innerHTML = markdownToHtml(data.summary);
            } else {
                summaryDiv.innerHTML = 'No summary returned.';
            }
        } catch (err) {
            summaryDiv.innerHTML = 'Error summarizing transcript.';
        }
    }

    recordBtn.addEventListener('click', startRecording);
    stopBtn.addEventListener('click', stopRecording);
    summarizeBtn.addEventListener('click', sendTranscriptForSummary);
    </script>
</body>
</html>
