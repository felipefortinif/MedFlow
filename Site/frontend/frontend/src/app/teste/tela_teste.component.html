<!DOCTYPE html>
<h1>Record Audio</h1>

<button id="recordBtn" (click)="startRecording()" [disabled]="isRecording">Start Recording</button>

<button id="stopBtn" (click)="stopRecording()" [disabled]="!isRecording">Stop Recording</button>

<div id="status" class="status">{{ statusText }}</div>

<div id="transcript" class="box">
  {{ transcriptText || 'Transcript will appear here...' }}
</div>

<button id="summarizeBtn" (click)="sendTranscriptForSummary()" [disabled]="!canSummarize">
  Summarize
</button>

<div id="summary" class="box summary" [innerHTML]="summaryHtml"></div>
