<div class="screen">
  <div class="topbar">
    <h1>Prontuário do paciente {{ patientName }}</h1>
    <a class="ghost-btn" routerLink="/tela-principal">← Início</a>
  </div>

    <h3>Transcrição</h3>
    <div class="transcript">{{ state.fullTranscript() || 'Sem transcrição.' }}</div>

    <button class="record-btn" (click)="gerarProntuario()" [disabled]="isLoading || !state.fullTranscript()">Gerar Prontuário</button>
    <div class="status" *ngIf="isLoading">Gerando prontuário...</div>

    <div class="summary" *ngIf="summary">
      <h3>Prontuário</h3>
  <div [innerHTML]="summary"></div>
    </div>
</div>
