<div class="screen">
  <div class="topbar">
    <h1>Paciente: {{ patientName }}</h1>
    <a class="ghost-btn" routerLink="/pacientes">← Voltar ao início</a>
  </div>

  <div class="record-area">
    <button class="record-btn" (click)="startRecording()" [disabled]="isRecording">🎤 Gravar Áudio</button>
    <button class="record-btn" (click)="stopRecording()" [disabled]="!isRecording">⏹️ Parar</button>

    <div class="status">{{ status }}</div>

    <div id="outputs">
      <h3>Transcrição (parcial):</h3>
      <div class="transcript">{{ transcriptText }}</div>
    </div>

    <button
      class="record-btn"
      *ngIf="showGenerate"
      (click)="generateProntuario()"
      [disabled]="!canSummarize || isSummarizing"
    >
      <ng-container *ngIf="!isSummarizing; else generatingLabel">📝 Gerar Prontuário</ng-container>
    </button>
    <ng-template #generatingLabel>⏳ Gerando...</ng-template>

    <div class="summary" *ngIf="summaryHtml || isSummarizing">
      <h3>Prontuário gerado:</h3>
      <div *ngIf="isSummarizing" class="summary-loading">Gerando prontuário...</div>
      <div *ngIf="!isSummarizing && summaryHtml" class="summary-content" [innerHTML]="summaryHtml"></div>
    </div>
  </div>
</div>
