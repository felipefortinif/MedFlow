<aside class="sidebar">
  <div class="logo">MedFlow</div>
  
  <nav class="menu">
    <a 
      *ngFor="let item of menuItems" 
      [routerLink]="item.path" 
      routerLinkActive="active"
      class="menu-item"
    >
      <span class="icon">{{ item.icon }}</span>
      <span class="label">{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <a routerLink="/perfil" routerLinkActive="active" class="settings-btn" title="Configurações">
      <img src="assets/icons/settings.png" class="icon">
      <span class="label">Configurações</span>
    </a>
    
    <button class="logout-btn" (click)="logout()" title="Sair">
      <img src="assets/icons/logout.png" class="icon">
      <span class="label">Sair</span>
    </button>
  </div>
</aside>
