<div class="auth-screen">
  <div class="card">
    <div class="tabs">
      <button type="button" class="tab" [class.active]="mode==='login'" (click)="switch('login')">Entrar</button>
      <button type="button" class="tab" [class.active]="mode==='signup'" (click)="switch('signup')">Cadastrar</button>
    </div>

    <form *ngIf="mode==='login'" (ngSubmit)="onLogin()">
      <label>Email</label>
      <input type="email" [(ngModel)]="loginEmail" name="loginEmail" required />

      <label>Senha</label>
      <input type="password" [(ngModel)]="loginPassword" name="loginPassword" required />

      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button class="primary" type="submit" [disabled]="isLoading">Entrar</button>
        <a class="link" (click)="switch('forgot')">Esqueci minha senha</a>
      </div>
    </form>

    <form *ngIf="mode==='signup'" (ngSubmit)="onSignup()">
      <!-- Required by backend: username, password, email, cpf, crm, specialty -->
      <label>Usuário (username)</label>
      <input type="text" [(ngModel)]="signupUsername" name="signupUsername" required />

      <label>Primeiro nome</label>
      <input type="text" [(ngModel)]="signupFirstName" name="signupFirstName" />

      <label>Sobrenome</label>
      <input type="text" [(ngModel)]="signupLastName" name="signupLastName" />

      <label>Email</label>
      <input type="email" [(ngModel)]="signupEmail" name="signupEmail" required />

      <label>Senha</label>
      <input type="password" [(ngModel)]="signupPassword" name="signupPassword" required />

      <label>Confirmar senha</label>
      <input type="password" [(ngModel)]="signupPasswordConfirm" name="signupPasswordConfirm" required />

      <label>CPF</label>
      <input type="text" [(ngModel)]="signupCpf" name="signupCpf" required />

      <label>Telefone</label>
      <input type="tel" [(ngModel)]="signupPhone" name="signupPhone" />

      <label>Data de nascimento</label>
      <input type="date" [(ngModel)]="signupDateOfBirth" name="signupDateOfBirth" />

      <label>CRM</label>
      <input type="text" [(ngModel)]="signupCrm" name="signupCrm" required />

      <label>Especialidade (ID)</label>
      <input type="number" [(ngModel)]="signupSpecialty" name="signupSpecialty" required />

      <button class="primary" type="submit" [disabled]="isLoading">Cadastrar</button>
    </form>

    <form *ngIf="mode==='forgot'" (ngSubmit)="confirmPasswordReset()">
      <div style="display:flex; gap:8px; align-items:flex-end;">
        <div style="flex:1;">
          <label>Email</label>
          <input type="email" [(ngModel)]="forgotEmail" name="forgotEmail" required />
        </div>
        <div>
          <button type="button" class="secondary" (click)="sendPasswordReset()" [disabled]="isLoading || !forgotEmail">
            Enviar código
          </button>
        </div>
      </div>

      <label style="margin-top:8px;">Código</label>
      <input type="text" [(ngModel)]="forgotCode" name="forgotCode" required />

      <label>Nova senha</label>
      <input type="password" [(ngModel)]="forgotNewPassword" name="forgotNewPassword" required />

      <label>Confirmar nova senha</label>
      <input type="password" [(ngModel)]="forgotConfirmPassword" name="forgotConfirmPassword" required />

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
        <button class="primary" type="submit" [disabled]="isLoading">Confirmar</button>
        <a class="link" (click)="switch('login')">Voltar</a>
      </div>

      <div class="status" style="margin-top:10px;">
        <span *ngIf="isLoading">Processando...</span>
        <span class="muted" *ngIf="!isLoading && forgotMessage">{{ forgotMessage }}</span>
        <span class="error" *ngIf="!isLoading && forgotError">{{ forgotError }}</span>
      </div>
    </form>

    <div class="status" *ngIf="mode!=='forgot'">
      <span *ngIf="isLoading">Processando...</span>
      <span class="muted" *ngIf="!isLoading && success">{{ success }}</span>
      <span class="error" *ngIf="!isLoading && error">{{ error }}</span>
    </div>
  </div>
</div>
