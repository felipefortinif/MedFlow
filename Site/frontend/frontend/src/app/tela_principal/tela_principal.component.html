<div class="screen">
  <h1>Prontuário Automático</h1>

  <form (ngSubmit)="onSubmit()" #f="ngForm" autocomplete="on" novalidate>
    <label for="nome">Nome</label>
    <input id="nome" name="nome" [(ngModel)]="nome" type="text" required placeholder="Ex.: Maria Silva" />

    <label for="cpf">CPF</label>
    <input id="cpf" name="cpf" [(ngModel)]="cpf" type="text" inputmode="numeric" required placeholder="Somente números" />

    <label for="nascimento">Data de Nascimento</label>
    <input id="nascimento" name="nascimento" [(ngModel)]="nascimento" type="date" required />

    <button type="submit">Confirmar</button>
  </form>

  <p class="error" *ngIf="erro">{{ erro }}</p>
</div>
