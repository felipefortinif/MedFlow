<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Prontuário Automático — Cadastro</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="screen">
        <h1>Prontuário Automático</h1>

        <form id="patient-form" autocomplete="on" novalidate>
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required placeholder="Ex.: Maria Silva" />

            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" type="text" inputmode="numeric" required placeholder="Somente números" />

            <label for="nascimento">Data de Nascimento</label>
            <input id="nascimento" name="nascimento" type="date" required />

            <button type="submit">Confirmar</button>
        </form>

    </div>

    <script src="index.js"></script>
</body>

</html>
